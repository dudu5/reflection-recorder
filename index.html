<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reflection Recorder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* Scrollable top area for reflections */
    #scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* File loader (centered in scroll area before file loaded) */
    #loader {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    #file-btn {
      width: 100%;
      max-width: 360px;
      padding: 28px 20px;
      background: #1a1a1a;
      border: 2px dashed #333;
      border-radius: 16px;
      color: #888;
      font-size: 17px;
      cursor: pointer;
      text-align: center;
      display: block;
    }

    /* Live transcript */
    #live-transcript {
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      height: 100%;
      padding: 20px;
    }
    #live-transcript p {
      font-size: 22px;
      line-height: 1.6;
      color: #fff;
    }
    #live-transcript p.placeholder {
      color: #444;
      font-size: 18px;
    }

    #reflections-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #reflections-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    #reflections-actions {
      display: flex;
      gap: 8px;
    }

    #reflections-header span {
      font-size: 13px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #copy-btn {
      padding: 8px 16px;
      background: #1a1a1a;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #copy-btn:active { background: #2a2a2a; }

    #clear-btn {
      padding: 8px 16px;
      background: #1a1a1a;
      border: none;
      border-radius: 8px;
      color: #e63946;
      font-size: 14px;
      cursor: pointer;
    }
    #clear-btn:active { background: #2a2a2a; }

    #reflections-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reflection-item {
      background: #111;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.5;
      color: #ddd;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    .reflection-item .ts {
      color: #555;
      font-size: 13px;
      flex-shrink: 0;
    }

    .reflection-item .divider {
      color: #333;
      flex-shrink: 0;
    }

    /* Fixed bottom controls */
    #controls {
      flex-shrink: 0;
      background: #0a0a0a;
      padding: 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-top: 1px solid #1a1a1a;
    }

    /* Track name + progress */
    #progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #track-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #track-name {
      font-size: 14px;
      color: #aaa;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #change-file-btn {
      background: none;
      border: 1px solid #444;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      padding: 3px 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #progress {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    #progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    #time-display {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #aaa;
    }

    /* Skip buttons */
    .skip-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    @keyframes btn-tap {
      0%   { transform: scale(1);    background: #2a2a2a; }
      30%  { transform: scale(0.88); background: #444; }
      100% { transform: scale(1);    background: #2a2a2a; }
    }

    .skip-btn {
      flex: 1;
      padding: 14px 0;
      background: #2a2a2a;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.1s;
    }
    .skip-btn.tapped {
      animation: btn-tap 0.25s ease-out forwards;
    }

    /* Play / Reflect buttons */
    .main-btns {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    #play-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: #2a2a2a;
      color: #fff;
      font-size: 52px;
      cursor: pointer;
    }
    #play-btn:active { background: #444; }

    #reflect-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: #e63946;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.15s;
    }
    #reflect-btn.recording { background: #2a9d8f; }
    #reflect-btn:active { opacity: 0.85; }

    /* Speed */
    #speed-btn {
      background: none;
      border: 1px solid #555;
      border-radius: 6px;
      color: #bbb;
      font-size: 13px;
      padding: 3px 8px;
      cursor: pointer;
    }
    #speed-panel {
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    #speed-panel.visible { display: flex; }
    #speed-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888;
    }
    #speed-slider {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    #speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    /* Status */
    #status {
      font-size: 14px;
      color: #888;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div id="scroll-area">
    <input id="file-input" type="file" accept="audio/*,.m4a,.mp4,.caf,.aac,.mp3,.wav" style="display:none">

    <div id="loader">
      <label id="file-btn" for="file-input">Tap to load audio file</label>
    </div>

    <div id="live-transcript">
      <p class="placeholder" id="live-text">Listening...</p>
    </div>

    <div id="reflections-section">
      <div id="reflections-header">
        <span>Reflections</span>
        <div id="reflections-actions">
          <button id="clear-btn">Clear</button>
          <button id="copy-btn">Copy all</button>
        </div>
      </div>
      <div id="reflections-list"></div>
    </div>
  </div>

  <audio id="audio"></audio>

  <div id="controls" style="display:none">
    <div class="main-btns">
      <button id="play-btn">▶</button>
      <button id="reflect-btn">REFLECT</button>
    </div>

    <div class="skip-row">
      <button class="skip-btn" data-skip="-5">−5s</button>
      <button class="skip-btn" data-skip="-10">−10s</button>
      <button class="skip-btn" data-skip="-15">−15s</button>
      <button class="skip-btn" data-skip="15">+15s</button>
      <button class="skip-btn" data-skip="10">+10s</button>
      <button class="skip-btn" data-skip="5">+5s</button>
    </div>

    <div id="progress-wrap">
      <div id="track-row">
        <div id="track-name"></div>
        <label id="change-file-btn" for="file-input">Change file</label>
      </div>
      <input id="progress" type="range" value="0" min="0" step="0.1">
      <div id="time-display">
        <span id="current-time">0:00</span>
        <button id="speed-btn">1x</button>
        <span id="duration">0:00</span>
      </div>
      <div id="speed-panel">
        <input id="speed-slider" type="range" min="0.75" max="3" step="0.25" value="1">
        <div id="speed-labels">
          <span>0.75x</span><span>1x</span><span>1.5x</span><span>2x</span><span>2.5x</span><span>3x</span>
        </div>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const fileInput = document.getElementById('file-input');
    const controls = document.getElementById('controls');
    const trackName = document.getElementById('track-name');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const playBtn = document.getElementById('play-btn');
    const reflectBtn = document.getElementById('reflect-btn');
    const statusEl = document.getElementById('status');
    const reflectionsSection = document.getElementById('reflections-section');
    const reflectionsList = document.getElementById('reflections-list');
    const copyBtn = document.getElementById('copy-btn');
    const clearBtn = document.getElementById('clear-btn');
    const liveTranscript = document.getElementById('live-transcript');
    const liveText = document.getElementById('live-text');
    const speedBtn = document.getElementById('speed-btn');
    const speedPanel = document.getElementById('speed-panel');
    const speedSlider = document.getElementById('speed-slider');

    const STORAGE_KEY = 'reflections';
    const reflections = [];
    let isRecording = false;
    let recognition;
    let currentTranscript = '';
    let reflectTimestamp = 0;
    let wasPlaying = false;

    // IndexedDB for audio file
    const DB_NAME = 'reflection-recorder';
    const DB_STORE = 'audio';

    const dbReady = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e);
    });

    function storeFile(file) {
      return dbReady.then(db => new Promise((resolve, reject) => {
        const req = db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(file, 'file');
        req.onsuccess = () => resolve();
        req.onerror = e => reject(e);
      }));
    }

    function loadFileFromDB() {
      return dbReady.then(db => new Promise((resolve) => {
        const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get('file');
        req.onsuccess = e => resolve(e.target.result || null);
        req.onerror = () => resolve(null);
      }));
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function loadAudioBlob(blob, name, restoreTime) {
      audio.src = URL.createObjectURL(blob);
      trackName.textContent = name;
      document.getElementById('loader').style.display = 'none';
      controls.style.display = 'flex';
      if (restoreTime) {
        audio.addEventListener('loadedmetadata', () => {
          audio.currentTime = restoreTime;
        }, { once: true });
      }
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const name = file.name.replace(/\.[^.]+$/, '');
      localStorage.setItem('trackName', name);
      localStorage.setItem('currentTime', 0);
      reflections.length = 0;
      localStorage.removeItem(STORAGE_KEY);
      reflectionsList.innerHTML = '';
      reflectionsSection.style.display = 'none';
      storeFile(file).then(() => loadAudioBlob(file, name, 0));
    });

    audio.addEventListener('timeupdate', () => {
      progress.value = audio.currentTime;
      currentTimeEl.textContent = fmt(audio.currentTime);
      localStorage.setItem('currentTime', audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      progress.max = audio.duration;
      durationEl.textContent = fmt(audio.duration);
    });

    audio.addEventListener('play', () => { playBtn.textContent = '⏸'; });
    audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });

    progress.addEventListener('input', () => {
      audio.currentTime = progress.value;
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) audio.play();
      else audio.pause();
    });

    document.querySelectorAll('.skip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + parseFloat(btn.dataset.skip)));
        btn.classList.remove('tapped');
        void btn.offsetWidth; // force reflow to restart animation
        btn.classList.add('tapped');
      });
    });

    reflectBtn.addEventListener('click', () => {
      if (!isRecording) startReflection();
      else stopReflection();
    });

    function startReflection() {
      if (!SpeechRecognition) {
        statusEl.textContent = 'Speech recognition not supported.';
        return;
      }
      reflectTimestamp = audio.currentTime;
      wasPlaying = !audio.paused;
      audio.pause();
      currentTranscript = '';

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (e) => {
        let t = '';
        for (let i = 0; i < e.results.length; i++) {
          t += e.results[i][0].transcript;
        }
        currentTranscript = t;
        liveText.textContent = t;
        liveText.classList.remove('placeholder');
      };

      recognition.onerror = (e) => {
        statusEl.textContent = 'Error: ' + e.error;
        isRecording = false;
        reflectBtn.textContent = 'REFLECT';
        reflectBtn.classList.remove('recording');
      };

      recognition.onend = () => {
        if (isRecording) stopReflection();
      };

      recognition.start();
      isRecording = true;
      reflectBtn.textContent = 'SAVE';
      reflectBtn.classList.add('recording');
      statusEl.textContent = '';
      liveText.textContent = 'Listening...';
      liveText.classList.add('placeholder');
      reflectionsSection.style.display = 'none';
      liveTranscript.style.display = 'flex';
      playBtn.disabled = true;
      playBtn.style.opacity = '0.3';
    }

    function stopReflection() {
      isRecording = false;
      recognition.stop();
      reflectBtn.textContent = 'REFLECT';
      reflectBtn.classList.remove('recording');

      liveTranscript.style.display = 'none';
      playBtn.disabled = false;
      playBtn.style.opacity = '1';

      if (currentTranscript.trim()) {
        saveReflection(reflectTimestamp, currentTranscript.trim());
      }

      if (wasPlaying) {
        audio.pause();
        setTimeout(() => audio.play(), 100);
      }
    }

    function renderReflection(ts, text) {
      const item = document.createElement('div');
      item.className = 'reflection-item';
      item.innerHTML = `<span class="ts">${fmt(ts)}</span><span class="divider">|</span><span>${text}</span>`;
      reflectionsList.appendChild(item);
      reflectionsSection.style.display = 'flex';
    }

    function saveReflection(ts, text) {
      reflections.push({ ts, text });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(reflections));
      renderReflection(ts, text);
    }

    // Load saved reflections on start
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    saved.forEach(r => {
      reflections.push(r);
      renderReflection(r.ts, r.text);
    });

    // Restore audio file from IndexedDB on load
    loadFileFromDB().then(file => {
      if (!file) return;
      const name = localStorage.getItem('trackName') || file.name.replace(/\.[^.]+$/, '');
      const time = parseFloat(localStorage.getItem('currentTime') || 0);
      loadAudioBlob(file, name, time);
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Clear all reflections? This cannot be undone.')) {
        reflections.length = 0;
        localStorage.removeItem(STORAGE_KEY);
        reflectionsList.innerHTML = '';
        reflectionsSection.style.display = 'none';
      }
    });

    speedBtn.addEventListener('click', () => {
      speedPanel.classList.toggle('visible');
    });

    speedSlider.addEventListener('input', () => {
      const rate = parseFloat(speedSlider.value);
      audio.playbackRate = rate;
      speedBtn.textContent = rate === 1 ? '1x' : rate + 'x';
    });

    copyBtn.addEventListener('click', () => {
      const text = reflections.map(r => `[${fmt(r.ts)}] ${r.text}`).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy all', 1500);
      });
    });
  </script>
</body>
</html>
